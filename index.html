<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <title>Lịch nhắc</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 16px;
      background: #f3f5f7;
      color: #222;
    }
    .card {
      max-width: 480px;
      margin: auto;
      padding: 18px;
      border-radius: 14px;
      background: white;
    }
    input, button {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      margin: 7px 0;
      border-radius: 9px;
      font-size: 16px;
    }
    input[type="text"], input[type="time"] {
      border: 1px solid #ccc;
    }
    button {
      border: 0;
      background: #168acd;
      color: white;
    }
    .day-options label {
      display: inline-block;
      margin: 7px 8px 7px 0;
    }
    .day-options input {
      width: auto;
    }
    #status {
      white-space: pre-wrap;
    }
    .reminder {
      padding: 10px 0;
      border-top: 1px solid #ddd;
    }
    .delete {
      background: #d64545;
    }
  </style>
</head>
<body>
  <main class="card">
    <h2>📅 Lịch nhắc của tôi</h2>

    <label for="text">Nội dung nhắc</label>
    <input id="text" type="text" maxlength="300"
           placeholder="Ví dụ: Ôn tiếng Anh">

    <label for="time">Giờ nhắc</label>
    <input id="time" type="time" value="19:00">

    <p>Lặp vào ngày:</p>
    <div class="day-options">
      <label><input type="checkbox" value="1"> Thứ 2</label>
      <label><input type="checkbox" value="2"> Thứ 3</label>
      <label><input type="checkbox" value="3"> Thứ 4</label>
      <label><input type="checkbox" value="4"> Thứ 5</label>
      <label><input type="checkbox" value="5"> Thứ 6</label>
      <label><input type="checkbox" value="6"> Thứ 7</label>
      <label><input type="checkbox" value="7"> Chủ nhật</label>
    </div>

    <button id="addButton">Thêm lời nhắc</button>
    <p id="status">Đang tải lịch…</p>
    <div id="list"></div>
  </main>

  <script>
    const API_URL =
      "https://reminder-api.ht1-chien.workers.dev/api/reminders";

    const tg = window.Telegram && window.Telegram.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    const statusEl = document.getElementById("status");
    const listEl = document.getElementById("list");

    function getInitData() {
      if (!tg || !tg.initData) {
        throw new Error("Hãy mở Mini App bằng nút Menu trong Telegram.");
      }
      return tg.initData;
    }

    async function api(action, extra = {}) {
      const response = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          action,
          initData: getInitData(),
          ...extra
        })
      });

      const result = await response.json();
      if (!response.ok || result.error) {
        throw new Error(result.error || "Có lỗi khi gọi Worker.");
      }
      return result;
    }

    function makeElement(tag, text, className) {
      const element = document.createElement(tag);
      element.textContent = text;
      if (className) element.className = className;
      return element;
    }

    function daysLabel(csv) {
      const names = {
        "1": "Thứ 2", "2": "Thứ 3", "3": "Thứ 4",
        "4": "Thứ 5", "5": "Thứ 6", "6": "Thứ 7",
        "7": "Chủ nhật"
      };
      return csv.split(",").map(day => names[day] || day).join(", ");
    }

    async function loadReminders() {
      statusEl.textContent = "Đang tải lịch…";
      listEl.replaceChildren();

      try {
        const result = await api("list");
        statusEl.textContent = result.reminders.length
          ? "Các lời nhắc đã lưu:"
          : "Chưa có lời nhắc nào.";

        for (const reminder of result.reminders) {
          const item = document.createElement("section");
          item.className = "reminder";
          item.append(
            makeElement("strong", `${reminder.time} — ${reminder.text}`),
            makeElement("p", `Ngày: ${daysLabel(reminder.days)}`)
          );

          const button = makeElement("button", "Xóa lời nhắc", "delete");
          button.onclick = async () => {
            if (!confirm("Xóa lời nhắc này?")) return;
            try {
              await api("delete", { id: reminder.id });
              await loadReminders();
            } catch (error) {
              statusEl.textContent = error.message;
            }
          };

          item.append(button);
          listEl.append(item);
        }
      } catch (error) {
        statusEl.textContent = error.message;
      }
    }

    document.getElementById("addButton").onclick = async () => {
      const text = document.getElementById("text").value.trim();
      const time = document.getElementById("time").value;
      const days = [...document.querySelectorAll(
        ".day-options input:checked"
      )].map(input => input.value).join(",");

      statusEl.textContent = "Đang lưu…";

      try {
        await api("add", { text, time, days });
        document.getElementById("text").value = "";
        document.querySelectorAll(".day-options input")
          .forEach(input => input.checked = false);
        await loadReminders();
      } catch (error) {
        statusEl.textContent = error.message;
      }
    };

    loadReminders();
  </script>
</body>
</html>
